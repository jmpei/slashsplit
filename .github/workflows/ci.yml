# CI for every PR and push to main: lint + typecheck → unit → integration → build, with security
# scans in parallel. Also runs weekly so new advisories surface without a PR.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: Unit tests
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  integration:
    name: Integration tests
    needs: unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: slashsplit
          POSTGRES_PASSWORD: slashsplit
          POSTGRES_DB: slashsplit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slashsplit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://slashsplit:slashsplit@localhost:5432/slashsplit_test
      TEST_DATABASE_URL: postgresql://slashsplit:slashsplit@localhost:5432/slashsplit_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run test:integration

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm audit --audit-level=high

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build
    needs: [integration, audit, gitleaks]
    runs-on: ubuntu-latest
    env:
      # Placeholders so modules that read env at import can load; the build never connects.
      DATABASE_URL: postgresql://build:build@localhost:5432/build
      BETTER_AUTH_SECRET: ci-build-placeholder-secret-not-used-at-runtime
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
